[Service]
# Run the public web application without root privileges.
User=research-agent
Group=research-agent

# Secrets are kept outside the web application's project directory.
EnvironmentFile=/etc/research-agent/research-agent.env
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=PYTHONPATH=/opt/research-agent
Environment=RESEARCH_AGENT_RUNTIME_DIR=/var/lib/research-agent

# systemd creates this persistent runtime directory with service ownership.
StateDirectory=research-agent
StateDirectoryMode=0700

# Files created at runtime (logs, uploads, history) must not be readable by
# unrelated accounts on the server.
UMask=0077

# Systemd sandboxing: retain outbound HTTPS access for the model APIs while
# preventing privilege escalation and access to administrator home directories.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# The application source stays read-only; only persistent runtime state is writable.
ReadWritePaths=/var/lib/research-agent
