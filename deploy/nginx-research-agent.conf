# Nginx reverse-proxy template for public deployments.
# Keep client_max_body_size aligned with MAX_UPLOAD_TOTAL_MB in .env.

limit_req_zone $binary_remote_addr zone=research_agent_upload:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=research_agent_api:10m rate=60r/m;

upstream research_agent_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name example.com;

    # Public upload/request hard cap. This must stay in sync with MAX_UPLOAD_TOTAL_MB=30.
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-running analysis requests need more time than static page requests.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 300s;

    location = /api/literature-analysis/pdf {
        client_max_body_size 30m;
        limit_req zone=research_agent_upload burst=10 nodelay;
        proxy_pass http://research_agent_app;
    }

    location /api/ {
        limit_req zone=research_agent_api burst=120 nodelay;
        proxy_pass http://research_agent_app;
    }

    location /health {
        proxy_pass http://research_agent_app;
    }

    location / {
        proxy_pass http://research_agent_app;
    }
}
