# This file is installed under /etc/nginx/conf.d/ (the http context).
# It bounds anonymous use of the server-side model APIs without exposing
# provider credentials to browsers.
limit_req_zone $binary_remote_addr zone=research_agent_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=research_agent_upload:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=research_agent_conn:10m;
